  name: AWS Lambda CI/CD

  on:
    push:
      branches:
        - main
        - homologacao
        - develop

    pull_request:
      branches:
        - main
        - homologacao
        - develop

  permissions:
    contents: read

  env:
    AWS_REGION: sa-east-1
    JAVA_VERSION: '17'
    TERRAFORM_VERSION: '1.9.0'
    S3_BUCKET: f1rsters-tech-challenge-lambda-artifacts
    LAMBDA_S3_KEY: auth-function.jar

  jobs:

    # ============================================================
    # BUILD + TEST
    # ============================================================
    build_and_test:
      name: Build and Test Lambda
      runs-on: ubuntu-latest

      steps:
        - name: Checkout
          uses: actions/checkout@v5

        - name: Setup Java
          uses: actions/setup-java@v5
          with:
            distribution: temurin
            java-version: ${{ env.JAVA_VERSION }}
            cache: maven

        - name: Build, Test and Static Analysis
          run: |
            mvn -B clean verify

        - name: Verify Lambda JAR
          run: |
            test -f target/auth-function.jar

        - name: Upload Lambda Artifact
          uses: actions/upload-artifact@v4
          with:
            name: auth-function-jar
            path: target/auth-function.jar


    # ============================================================
    # TERRAFORM PLAN
    # ============================================================
    terraform_plan:
      name: Terraform Plan
      runs-on: ubuntu-latest
      needs: build_and_test

      steps:
        - name: Checkout
          uses: actions/checkout@v5

        - name: Setup Terraform
          uses: hashicorp/setup-terraform@v3
          with:
            terraform
